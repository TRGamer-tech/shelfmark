# Builds the app and publishes the debug APK as a GitHub release.
#
# It runs by itself whenever something is merged into main. The version is read from
# app/build.gradle.kts, and the tag v<versionName> is created together with the release.
# A version is published once: a merge that does not raise versionName (a change to the
# documentation, say) builds nothing and says so.
#
# It can also be started by hand:
#   - Actions > Release > Run workflow (on main).
#   - Pushing a tag like v1.2.0. It has to match versionName.
#
# The APK is signed with the project's own key, which lives in two repository
# secrets (Settings > Secrets and variables > Actions) and nowhere in the repository:
#
#   SHELFMARK_KEYSTORE_BASE64    the keystore file, base64 encoded
#   SHELFMARK_KEYSTORE_PASSWORD  its password
#
# Without the secrets the workflow fails before building, because an APK signed with
# any other key could not be installed over the app people already have.
#
# Two more secrets name the server for friends (a Supabase project, see supabase/):
#
#   SHELFMARK_SUPABASE_URL  the project address, https://xxxxxxxx.supabase.co
#   SHELFMARK_SUPABASE_KEY  the publishable key of the project (the public one)
#
# They are optional. Without them the app is built without a server: friends exchange
# files, or enter a server in the settings.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          NAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$NAME" ]; then
            echo "::error::No versionName found in app/build.gradle.kts."
            exit 1
          fi
          TAG="v$NAME"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match versionName $NAME in app/build.gradle.kts."
            exit 1
          fi
          # A version is published once. Building other code under the same number would
          # leave people with two different apps that both call themselves the same.
          # Asked from git itself: no output means there is no such tag yet. For an annotated
          # tag the second line names the commit it points to.
          EXISTING="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$GITHUB_SHA" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
              # An ordinary merge that left the version alone. Nothing to do, and nothing wrong.
              echo "::notice::$TAG is published already, so this merge builds nothing. Raise versionName and versionCode in app/build.gradle.kts for a new release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$TAG exists already and points to another commit. Raise versionName and versionCode in app/build.gradle.kts first."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG from $GITHUB_SHA"

      - uses: actions/setup-java@v5
        if: steps.version.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELFMARK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELFMARK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets SHELFMARK_KEYSTORE_BASE64 and SHELFMARK_KEYSTORE_PASSWORD are missing. Add them under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/shelfmark.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/shelfmark.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore in SHELFMARK_KEYSTORE_BASE64 cannot be opened with SHELFMARK_KEYSTORE_PASSWORD. Check both secrets."
            exit 1
          fi

      - name: Android SDK
        if: steps.version.outputs.release == 'true'
        run: |
          # The runner's SDK tools can be older than the platform this app is built against,
          # so they update themselves first. Nothing here may stop the run: with the licences
          # accepted, the build fetches whatever is still missing by itself.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmdline-tools;latest" > /dev/null || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" || echo "::notice::sdkmanager could not preinstall the SDK packages, the build will fetch them."

      - name: Build
        if: steps.version.outputs.release == 'true'
        env:
          SHELFMARK_KEYSTORE_FILE: ${{ runner.temp }}/shelfmark.jks
          SHELFMARK_KEYSTORE_PASSWORD: ${{ secrets.SHELFMARK_KEYSTORE_PASSWORD }}
          SHELFMARK_SUPABASE_URL: ${{ secrets.SHELFMARK_SUPABASE_URL }}
          SHELFMARK_SUPABASE_KEY: ${{ secrets.SHELFMARK_SUPABASE_KEY }}
        run: |
          if [ -z "$SHELFMARK_SUPABASE_URL" ] || [ -z "$SHELFMARK_SUPABASE_KEY" ]; then
            echo "::notice::No server for friends is set (SHELFMARK_SUPABASE_URL, SHELFMARK_SUPABASE_KEY). The app is built without one."
          fi
          ./gradlew --no-daemon :app:assembleDebug

      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          # Only the debug build is published for now. The optimised build
          # (:app:assembleRelease) joins it once the app is ready for a real release.
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Shelfmark-$VERSION-debug.apk"
          # Refuse to publish anything that does not carry the project's signature.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          for apk in dist/*.apk; do
            if ! "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=Shelfmark"; then
              echo "::error::$apk is not signed with the Shelfmark key."
              exit 1
            fi
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          elif [ -f "docs/releases/$TAG.md" ]; then
            # Notes written by hand live in docs/releases/<tag>.md.
            # Published as a pre-release for now. Drop --prerelease once the app leaves that stage.
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "Shelfmark $VERSION" --notes-file "docs/releases/$TAG.md" --prerelease
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "Shelfmark $VERSION" --generate-notes --prerelease
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/shelfmark.jks"
